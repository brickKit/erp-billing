[project]
name = "contract-erp-billing"
version = "3.0.0a1"
description = "Generated code of the billing contract (be.erp.billing.v3): messages and gRPC stubs"
requires-python = ">=3.15,<3.16"
# The generated code checks it runs on a protobuf at least as new as the one it was generated for (protoc 36.2).
dependencies = ["protobuf>=7.36.2", "grpcio>=1.84.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# be/ is a namespace shared by the contract packages (be.authz, be.iam, be.audit, be.mdm, be.erp...): no __init__.py on the way down.
only-include = ["be"]
